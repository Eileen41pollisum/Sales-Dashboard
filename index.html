<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlet performance</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Outlet performance</h1>
      <div class="sub" id="range"></div>
    </div>
    <div class="filters" id="filters"></div>
  </header>

  <section class="kpis">
    <div class="card kpi"><div class="label">Total sales</div><div class="value" id="k-sales"></div><div class="note" id="n-sales"></div></div>
    <div class="card kpi"><div class="label">% of target</div><div class="value accent" id="k-target"></div><div class="note" id="n-target"></div></div>
    <div class="card kpi"><div class="label">Orders</div><div class="value" id="k-orders"></div><div class="note" id="n-orders"></div></div>
    <div class="card kpi"><div class="label">Returns %</div><div class="value" id="k-returns"></div><div class="note" id="n-returns"></div></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>Sales as % of target, by outlet-week</h2>
      <div class="legend"><span><i style="background:var(--bar)"></i>90% or above</span><span><i style="background:var(--bad)"></i>Below 90%</span></div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="card">
      <h2>Needs attention</h2>
      <ul class="list" id="attention"></ul>
    </div>
  </section>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
